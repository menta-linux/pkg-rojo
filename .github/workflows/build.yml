name: Build Debian packages

on:
  push:
    branches: [master]
    tags: ['menta/*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: debian:unstable
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils quilt jq gh devscripts equivs build-essential fakeroot

      - uses: actions/checkout@v4

      - name: Fetch upstream commit
        run: |
          # version looks like 0.1.0+git20261022.30cc46f-1menta1 -> commit 30cc46f
          UPSTREAM=$(dpkg-parsechangelog -S Version | sed 's/-[^-]*$//')
          COMMIT=${UPSTREAM##*.}
          mkdir -p ../build
          git clone https://github.com/KeremSoke/rojo.git ../build/upstream
          git -C ../build/upstream checkout "$COMMIT"
          git -C ../build/upstream archive --format=tar --prefix="rojo-${UPSTREAM}/" HEAD \
            | xz > "../build/rojo_${UPSTREAM}.orig.tar.xz"
          tar -C ../build -xf "../build/rojo_${UPSTREAM}.orig.tar.xz"
          cp -a debian "../build/rojo-${UPSTREAM}/"
          echo "SRCDIR=$(realpath ../build/rojo-${UPSTREAM})" >> "$GITHUB_ENV"

      - name: Apply quilt patches
        working-directory: ${{ env.SRCDIR }}
        run: |
          export QUILT_PATCHES=debian/patches
          if [ -s debian/patches/series ]; then quilt push -a; fi

      - name: Install build dependencies
        working-directory: ${{ env.SRCDIR }}
        run: |
          set -o pipefail
          (mk-build-deps debian/control && apt-get install -y --no-install-recommends ./*-build-deps_*.deb) 2>&1 | tee /tmp/deps.log

      - name: Build
        working-directory: ${{ env.SRCDIR }}
        run: |
          set -o pipefail
          dpkg-buildpackage -us -uc -b 2>&1 | tee /tmp/build.log

      - name: Report failure
        if: failure()
        run: |
          for f in /tmp/menta.log /tmp/deps.log /tmp/build.log; do
            [ -f "$f" ] || continue
            msg=$( { grep -E '^E:|unmet|Unable|not installable|Depends:|but it is|error:|Error ' "$f" | head -15; echo ----; tail -n 30 "$f"; } | cut -c1-220 | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$(basename "$f")::$msg"
          done

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -v ../build/*.deb ../build/*.buildinfo ../build/*.changes "$GITHUB_WORKSPACE/artifacts/"

      - uses: actions/upload-artifact@v4
        with:
          name: rojo-debs
          path: artifacts/*

      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create latest artifacts/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "latest" --notes "Rolling build of $GITHUB_SHA"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/menta/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* -R "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME}" --notes "Build of $GITHUB_SHA"
