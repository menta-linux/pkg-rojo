name: build
# Thin, standardized package workflow. It does NOT discover releases or decide anything: it only runs when the orchestrator dispatches
# it with identifiers, and the shared worker refuses without a valid signed authorization. Development builds must not publish.
run-name: menta-build ${{ substr(inputs.candidate_id, 7, 16) }}
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        required: true
        type: string
      authorization_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    uses: menta-linux/orchestrator/.github/workflows/build-worker.yml@c93f8d5be7c1b3003fa013d0069a9a84a02aee5e
    with:
      candidate_id: ${{ inputs.candidate_id }}
      authorization_id: ${{ inputs.authorization_id }}
      orchestrator_sha: c93f8d5be7c1b3003fa013d0069a9a84a02aee5e
