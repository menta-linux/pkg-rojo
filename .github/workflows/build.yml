name: build
# Thin, standardized package workflow. It does NOT discover releases or decide anything: it only runs when the orchestrator dispatches
# it with identifiers, and the shared worker refuses without a valid signed authorization. Development builds must not publish.
run-name: menta-build ${{ inputs.candidate_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        required: true
        type: string
      authorization_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    uses: menta-linux/orchestrator/.github/workflows/build-worker.yml@1a62a9d2d898b3305619df9022f40635074aaaa4
    with:
      candidate_id: ${{ inputs.candidate_id }}
      authorization_id: ${{ inputs.authorization_id }}
      orchestrator_sha: 1a62a9d2d898b3305619df9022f40635074aaaa4
